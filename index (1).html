<title>GymTrack</title>
<style>
:root{--bg:#07070a;--bg2:#0d0d13;--panel:rgba(23,22,31,.72);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.14);--text:#f8f7fb;--muted:#94919f;--muted2:#6f6b79;--purple:#9b55ff;--purple2:#6f38ed;--purple3:#c184ff;--green:#68d391;--red:#ff667d;--radius:28px;--nav-h:74px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}body{font-weight:500;letter-spacing:-.02em;overflow-x:hidden}button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0}input{outline:none}
.app{min-height:100svh;background:radial-gradient(70% 55% at 88% 2%,rgba(133,73,245,.20),transparent 58%),radial-gradient(55% 40% at -5% 82%,rgba(77,45,139,.12),transparent 58%),linear-gradient(180deg,#08080b 0%,#09090e 100%);padding:env(safe-area-inset-top) 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);position:relative}.app:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.012),transparent 35%,rgba(255,255,255,.015));mix-blend-mode:screen}.view{max-width:640px;margin:0 auto;padding-top:14px}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0 2px 12px}.brand{display:flex;align-items:center;gap:10px}.brand-dot{width:28px;height:28px;border-radius:10px;background:linear-gradient(145deg,#b16dff,#6a28e9);box-shadow:0 7px 22px rgba(142,76,255,.34),inset 0 1px 0 rgba(255,255,255,.33);position:relative}.brand-dot:after{content:"";position:absolute;width:13px;height:4px;border-radius:4px;background:white;left:7px;top:12px;box-shadow:-3px 0 0 2px #9a54ff,3px 0 0 2px #9a54ff}.brand-name{font-size:15px;font-weight:750;letter-spacing:-.03em}.date-pill,.icon-btn{height:38px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}.date-pill{padding:0 14px;color:var(--muted);font-size:12px}.icon-btn{width:38px;color:var(--text);font-size:16px}.stack{display:grid;gap:12px}
.glass{background:linear-gradient(145deg,rgba(29,28,38,.82),rgba(12,12,18,.68));border:1px solid var(--line);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(255,255,255,.02),0 16px 50px rgba(0,0,0,.30);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);position:relative;overflow:hidden}.glass:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.06),transparent 30%,rgba(158,91,255,.04));pointer-events:none}.pad{padding:18px}.hero{padding:22px 18px 18px;min-height:188px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{color:var(--muted);font-size:12px;font-weight:650}.hero-title{font-size:31px;line-height:1.03;font-weight:800;letter-spacing:-.05em;margin-top:7px}.hero-sub{font-size:14px;color:#b2afba;line-height:1.35;margin-top:8px;max-width:90%}.hero-glow{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(144,73,255,.36),transparent 66%);right:-70px;top:-80px;filter:blur(2px);pointer-events:none}.section-head{display:flex;justify-content:space-between;align-items:end;margin:4px 4px 0}.section-title{font-size:17px;font-weight:760;letter-spacing:-.03em}.section-caption{font-size:11px;color:var(--muted2)}
.next-card{padding:16px}.next-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.next-type{font-size:13px;color:#c2bdcb}.next-date{font-size:12px;color:var(--purple3);font-weight:700}.next-name{font-size:22px;font-weight:780;letter-spacing:-.04em;margin:9px 0 3px}.next-description{font-size:13px;color:#c9b7e9;line-height:1.35;margin:4px 0 7px}.swipe{cursor:grab}.swipe:active{cursor:grabbing}.swipe-label{white-space:nowrap}.next-meta{font-size:12px;color:var(--muted);line-height:1.4}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#bcb8c4;font-size:11px}
.swipe{height:62px;border-radius:31px;background:linear-gradient(135deg,rgba(41,39,54,.96),rgba(24,23,33,.86));border:1px solid rgba(160,98,255,.20);padding:6px;display:flex;align-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 34px rgba(0,0,0,.26);touch-action:none;user-select:none}.swipe-track{position:absolute;left:15px;right:86px;height:3px;border-radius:4px;background:linear-gradient(90deg,rgba(155,85,255,.35),rgba(155,85,255,.02));opacity:.9}.swipe-label{position:absolute;left:76px;right:14px;text-align:center;color:#aca8b5;font-size:12px;pointer-events:none;transition:.2s ease}.swipe-label strong{color:#fff;font-weight:700}.swipe-knob{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#b978ff,#7435ed);box-shadow:0 8px 24px rgba(129,59,238,.42),inset 0 1px 0 rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;z-index:2;transform:translateX(0);transition:transform .42s cubic-bezier(.22,.8,.24,1)}.swipe-knob span{transform:translateX(1px);transition:transform .24s ease}.swipe.ready .swipe-knob{box-shadow:0 10px 28px rgba(153,82,255,.58),inset 0 1px 0 rgba(255,255,255,.42)}.swipe.ready .swipe-label{color:#d8caff}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}

function drawChart(){const canvas=$('#statsCanvas');if(!canvas)return;const all=exerciseStats(),ex=all.find(x=>x.id===(state.statsSelected||''))||all[0];if(!ex)return;const m=state.statsMetric||'weight',ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(320,Math.round((rect.width||320)*dpr));canvas.height=Math.round(210*dpr);ctx.scale(dpr,dpr);const W=rect.width||320,H=210,pts=ex.points.slice(-12),vals=pts.map(p=>Number(p[m])||0);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min=Math.max(0,min-1);max=max+1}else{const pv=(max-min)*.18;min=Math.max(0,min-pv);max+=pv}ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let i=0;i<4;i++){const y=20+i*(H-50)/3;ctx.beginPath();ctx.moveTo(8,y);ctx.lineTo(W-8,y);ctx.stroke()}const c=vals.map((v,i)=>({x:14+i*((W-28)/Math.max(1,vals.length-1)),y:18+(max-v)/(max-min)*(H-54)}));const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'rgba(155,85,255,.26)');grd.addColorStop(1,'rgba(155,85,255,0)');ctx.beginPath();ctx.moveTo(c[0].x,H-34);c.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(c.at(-1).x,H-34);ctx.closePath();ctx.fillStyle=grd;ctx.fill();ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#a967ff';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();c.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,i===c.length-1?4:2.6,0,Math.PI*2);ctx.fillStyle='#a967ff';ctx.shadowColor='rgba(169,103,255,.65)';ctx.shadowBlur=i===c.length-1?10:0;ctx.fill();ctx.shadowBlur=0});ctx.fillStyle='rgba(255,255,255,.36)';ctx.font='10px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';c.forEach((p,i)=>{if(i===0||i===c.length-1||vals.length<7||i%2===0)ctx.fillText(dateLabel(pts[i].date),p.x,H-12)})}
let calDate=new Date();function renderSettings(){const root=$('#settingsRoot'),days=[1,3,5,0];root.innerHTML=`<div class="stack"><div class="glass pad fade-up"><div class="section-title">Расписание и календарь</div><div class="section-caption" style="margin-top:3px">Тренировки автоматически привязаны к локальной дате iPhone</div><div style="margin-top:13px">${renderCalendar()}</div></div><div class="section-head"><div><div class="section-title">Тренировочные дни</div><div class="section-caption">${days.map(d=>WEEKDAYS[d]).join(' · ')}</div></div></div><div class="settings-list fade-up">${days.map(d=>{const p=state.schedule[d];return`<button class="setting-row click" data-edit-day="${d}"><div class="setting-icon">✦</div><div class="setting-main"><div class="setting-title">${WEEKDAYS[d]} · ${esc(p?.name||'Без тренировки')}</div><div class="setting-sub">${esc(p?.description||'Описание не задано')} · ${p?.exercises?.length||0} упражнений · ${p?estimateDuration(p):0} мин</div></div><div class="chev">›</div></button>`}).join('')}</div><div class="section-head"><div><div class="section-title">Приложение</div></div></div><div class="settings-list fade-up"><div class="setting-row"><div class="setting-icon">◐</div><div class="setting-main"><div class="setting-title">Автоматическая дата и время</div><div class="setting-sub">Берётся из часов устройства</div></div><button class="toggle ${state.settings.autoTime?'on':''}" id="toggleAuto"><i></i></button></div><button class="setting-row click" id="openProfile"><div class="setting-icon">◉</div><div class="setting-main"><div class="setting-title">Цель и вес</div><div class="setting-sub">${formatKg(latestBodyWeight())} кг → ${formatKg(state.settings.targetWeight)} кг</div></div><div class="chev">›</div></button><button class="setting-row click" id="exportData"><div class="setting-icon">⇧</div><div class="setting-main"><div class="setting-title">Экспорт данных</div><div class="setting-sub">JSON-файл с расписанием и историей</div></div function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,cells=[];for(let i=0;i<lead;i++)cells.push('<div class="cal-day muted"></div>');for(let d=1;d<=daysIn;d++){const x=new Date(y,m,d),s=isoLocal(x),work=!!state.schedule[x.getDay()];cells.push(`<button class="cal-day ${work?'work':''} ${s===state.selectedDate?'selected':''} ${s===isoLocal(today())?'today':''}" data-date="${s}">${d}${work?'<span class="dot"></span>':''}</button>`)}while(cells.length%7)cells.push('<div class="cal-day muted"></div>');return`<div class="calendar"><div class="cal-head"><button class="icon-btn" id="calPrev">‹</button><div class="cal-title">${MONTHS[m]} ${y}</div><button class="icon-btn" id="calNext">›</button></div><div class="cal-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-week">${x}</div>`).join('')}${cells.join('')}</div><div class="divider"></div>${renderSelectedDay(state.selectedDate)}</div>`}
function renderSelectedDay(s){const d=parseISO(s),p=state.schedule[d.getDay()],rec=state.workouts[s];return`<div><div style="font-size:12px;color:var(--muted)">${dateFull(s)}</div><div style="margin-top:5px;font-size:15px;font-weight:760">${p?esc(p.name):'День отдыха'}</div><div class="helper">${p?`${esc(p.description||'Описание не задано')} · ${p.exercises.length} упражнений · ${estimateDuration(p)} мин · ${rec?.completed?'сессия завершена':rec?'сессия начата':'сессии пока нет'}`:'Следующая тренировка: '+(nextWorkout(d,false)?dateFull(nextWorkout(d,false).date):'не задана')}</div></div>`}
function openScheduleEditor(day){state.editorDay=day;$('#scheduleDetail').classList.add('open');renderScheduleEditor()}function closeScheduleEditor(){syncEditorToState(state.editorDay??1);$('#scheduleDetail').classList.remove('open');render();}
function renderScheduleEditor(){const day=state.editorDay??1,p=state.schedule[day]||{name:'',exercises:[]},days=[1,3,5,0],root=$('#scheduleEditorRoot');root.innerHTML=`<div class="detail-top"><button class="icon-btn" id="closeEditor">‹</button><h2>${WEEKDAYS[day]} · тренировка</h2><button class="pill purple" id="savePlan">Сохранить</button></div><div class="glass editor-day"><div class="day-chip-row">${days.map(d=>`<button class="day-chip ${d===day?'active':''}" data-editor-day="${d}">${WEEKDAYS[d]}<br><span style="font-size:9px">${esc((state.schedule[d]?.name||'Тренировка').slice(0,12))}</span></button>`).join('')}</div><div class="form-grid"><div><label class="form-label">Название тренировки</label><input class="form-input" id="planName" value="${esc(p.name)}" placeholder="Например, Грудь + трицепс"></div><div><label class="form-label">Описание / мышечные группы</label><input class="form-input" id="planDescription" value="${esc(p.description||'')}" placeholder="Например, грудь, трицепс"></div><div><label class="form-label">Длительность сессии, минут</label><input class="form-input" id="planDuration" type="number" inputmode="numeric" min="10" max="240" step="5" value="${estimateDuration(p)}" placeholder="45"><div class="helper">Настраивается отдельно для каждой тренировки и используется в карточке сессии.</div></div></div><div class="divider"></div><div class="section-title">Упражнения</div><div class="helper">Здесь задаётся только план. На сессии ты вручную вводишь фактический вес, повторения и при необходимости меняешь число подходов.</div><div id="editorExercises">${p.exercises.map(renderExerciseEditor).join('')}</div><button class="text-btn add-exercise" id="addExercise">＋ Добавить упражнение</button></div>`;$('#closeEditor').addEventListener('click',closeScheduleEditor);$('#savePlan').addEventListener('click',()=>savePlan(day));$('#addExercise').addEventListener('click',()=>{state.schedule[day].exercises.push({id:uid('ex'),name:'Новое упражнение',sets:3,reps:'8–12'});persist();renderScheduleEditor()});$$('[data-editor-day]').forEach(b=>b.addEventListener('click',()=>{savePlan(day,true);state.editorDay=+b.dataset.editorDay;renderScheduleEditor()}));$$('.delete-ex').forEach(b=>b.addEventListener('click',()=>{syncEditorToState(day);state.schedule[day].exercises.splice(+b.dataset.index,1);persist();renderScheduleEditor()}))}
function renderExerciseEditor(e,i){return`<div class="exercise-edit"><div class="edit-grid"><input class="tiny-input edit-name" data-index="${i}" value="${esc(e.name)}" placeholder="Упражнение"><input class="tiny-input edit-sets" data-index="${i}" type="number" min="1" max="20" value="${e.sets}"><input class="tiny-input edit-reps" data-index="${i}" value="${esc(e.reps)}" placeholder="8–12"><button class="icon-btn delete-ex" data-index="${i}">×</button></div><div class="small-note" style="margin-top:8px">${i+1}. цель: ${e.sets} подхода · ${esc(e.reps)} повторений</div></div>`}
function syncEditorToState(day){const p=state.schedule[day]||{name:'',description:'',duration:45,exercises:[]};p.name=$('#planName')?.value.trim()||'Тренировка';p.description=$('#planDescription')?.value.trim()||'Мышечные группы не указаны';p.duration=clamp(parseInt($('#planDuration')?.value||p.duration||45,10)||45,10,240);p.exercises=p.exercises.map((e,i)=>{const n=$(`.edit-name[data-index="${i}"]`),s=$(`.edit-sets[data-index="${i}"]`),r=$(`.edit-reps[data-index="${i}"]`);return{...e,name:n?.value.trim()||'Упражнение',sets:clamp(parseInt(s?.value||e.sets,10)||1,1,20),reps:r?.value.trim()||'8–12'}});state.schedule[day]=p;persist()}

function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gymtrack-backup-${isoLocal(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Резервная копия создана')}function resetApp(){showModal('<div class="handle"></div><h3>Сбросить всё?</h3><p>Будут удалены расписание, история тренировок и настройки с этого устройства.</p><button class="primary danger" id="confirmReset" style="margin-top:10px">Удалить всё</button><button class="secondary" id="modalClose" style="width:100%;margin-top:8px">Отмена</button>');$('#confirmReset').addEventListener('click',()=>{localStorage.removeItem(APP_KEY);state=defaultState();closeModal();render();toast('Приложение сброшено')})}
function showModal(html){const m=$('#genericModal'),s=$('#genericSheet');s.innerHTML=html;m.classList.add('open');s.querySelectorAll('#modalClose').forEach(b=>b.addEventListener('click',closeModal))}function closeModal(){$('#genericModal').classList.remove('open')}$('#genericModal').addEventListener('click',e=>{if(e.target.id==='genericModal')closeModal()});
function navTo(t){$$('.screen').forEach(s=>s.classList.toggle('active',s.dataset.screen===t));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===t));window.scrollTo({top:0,behavior:'smooth'});if(t==='stats'){renderStats();drawChart()}if(t==='settings')renderSettings()}$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.nav)));$('#statsRefresh').addEventListener('click',()=>{renderStats();drawChart();toast('Статистика обновлена')});$('#openAppInfo').addEventListener('click',()=>showModal('<div class="handle"></div><h3>GymTrack</h3><p>iPhone-first локальный трекер тренировок. Данные не отправляются на сервер. Обновление кода на GitHub Pages само по себе не удаляет localStorage этой версии сайта. Старт тренировки на тренировочный день подтверждается только свайпом вправо. Длительность каждой тренировки настраивается отдельно в настройках.</p><button class="primary" id="modalClose">Закрыть</button>'));
function bindSwipe(el){const knob=el.querySelector('.swipe-knob');let startX=0,current=0,drag=false,max=el.clientWidth-62,committed=false;const set=x=>{current=clamp(x,0,max);knob.style.transform=`translateX(${current}px)`;el.classList.toggle('ready',current>max*.72)};const end=()=>{if(!drag)return;drag=false;if(current>max*.72&&!committed){committed=true;set(max);if(navigator.vibrate)navigator.vibrate(18);setTimeout(startWorkout,180)}else{current=0;knob.style.transform='';el.classList.remove('ready')}};el.addEventListener('pointerdown',e=>{if(committed)return;drag=true;startX=e.clientX-current;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(drag)set(e.clientX-startX)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
